plugins {
    id 'java'
    id 'net.minecraftforge.gradle' version '[6.0,6.2)'
}
version = '1.3.0'
group = 'com.bolat.casinomod'
base { archivesName = 'casinomod' }
java.toolchain.languageVersion = JavaLanguageVersion.of(17)
minecraft {
    mappings channel: 'official', version: '1.20.1'
    runs {
        client { workingDirectory project.file('run'); mods { casinomod { source sourceSets.main } } }
        server { workingDirectory project.file('run'); args '--nogui'; mods { casinomod { source sourceSets.main } } }
    }
}
dependencies { minecraft 'net.minecraftforge:forge:1.20.1-47.3.0' }
jar.finalizedBy('reobfJar')
